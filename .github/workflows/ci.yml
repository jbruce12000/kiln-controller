name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lgpio (via rpi-lgpio) only publishes wheels for Python 3.11/3.12;
        # 3.13+ falls back to an sdist build that requires swig and fails.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Sync dependencies (fails if uv.lock is stale)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest Test -q

      - name: Lint
        run: uv run ruff check .
