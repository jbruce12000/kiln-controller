name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies # needed for python version >= 3.13
        run: sudo apt install swig liblgpio-dev python3-dev
      - name: Sync dependencies (fails if uv.lock is stale)
        run: uv sync --all-groups --locked --python ${{ matrix.python-version }}
      - name: Run format check
        run: |
          uv run ruff format --check
      - name: Run linter
        run: |
          uv run ruff check .
      - name: Run tests
        run: |
          uv run pytest --doctest-modules -v Test -q
      - name: Check for vulnerabilities
        run: |
          uv run pyscan
